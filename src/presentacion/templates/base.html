<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BitacoraBio 2026 · {% block titulo %}Registrar experimento{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
{% block pagina %}
<div class="app">
  <aside class="sidebar">
    <div class="brand">BitacoraBio 2026</div>
    <nav class="nav">
      <a href="/registro" class="{{ 'active' if request.path.startswith('/registro') or request.path == '/' }}">Inicio</a>
      <a href="/proyectos" class="{{ 'active' if request.path.startswith('/proyectos') }}">Mis proyectos</a>
      <a href="/experimentos" class="{{ 'active' if request.path.startswith('/experimentos') }}">Experimentos</a>
      <a href="/buscar" class="{{ 'active' if request.path.startswith('/buscar') }}">Buscar</a>
    </nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="breadcrumb"><span>Inicio</span><span>›</span><span>{% block miga %}Cargar experimento{% endblock %}</span></div>
      <div class="user-btn" style="cursor:default">
        <span class="avatar">{{ usuario[:2]|upper }}</span>
        <span class="user-info"><div class="name">{{ usuario }}</div><div class="role">Investigador/a</div></span>
      </div>
    </header>
    <main class="content">{% block contenido %}{% endblock %}</main>
  </div>
</div>
{% endblock %}
</body>
</html>
